name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main # Runs whenever you push code to the main branch

permissions:
  contents: write # Grants permission to deploy to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies and build frontend
      - name: Install & Build Frontend
        env:
          CI: false
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      # Step 4: Deploy build output to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
